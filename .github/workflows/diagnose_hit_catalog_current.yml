name: Diagnose current HIT catalog

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose_hit_catalog_current.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pdfplumber requests
      - name: Extract AT FT OTX catalog pages
        run: |
          python - <<'PY'
          import requests, pdfplumber
          url='https://www.leviat.com/en-us/mwdownloads/download/link/id/898.pdf'
          data=requests.get(url, timeout=60).content
          open('/tmp/hit.pdf','wb').write(data)
          print('bytes',len(data),data[:4])
          with pdfplumber.open('/tmp/hit.pdf') as pdf:
              print('pages',len(pdf.pages))
              for pno in range(128,150):
                  p=pdf.pages[pno-1]
                  print('\n===== CATALOG PAGE',pno,'=====')
                  print(p.extract_text(layout=True, x_tolerance=1, y_tolerance=2) or '')
          PY
