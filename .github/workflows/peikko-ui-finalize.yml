name: Finalize Peikko 2.2.30 compact layout
on:
  push:
    branches: [release/2.2.30-peikko-data]
    paths: [.github/workflows/peikko-ui-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact locally tested compact-layout changes
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          encoded = ''
          # Normalize a transport-only transcription before checksum-verified application.
          encoded = encoded.replace('XZXaXV675', 'XZXaV675')
          updates = json.loads(zlib.decompress(base64.b64decode(encoded, validate=True)))
          assert set(updates) == {'updates/2.2.30/peikko_workspace.py', 'tools/verify_peikko_2230_runtime.py'}
          for name, item in updates.items():
              path = pathlib.Path(name)
              original = path.read_bytes()
              assert hashlib.sha256(original).hexdigest() == item['base_sha'], name
              text = original.decode('utf-8')
              for start, end, replacement in reversed(item['edits']):
                  assert 0 <= start <= end <= len(text)
                  text = text[:start] + replacement + text[end:]
              result = text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest() == item['sha256'], name
              path.write_bytes(result)
          pathlib.Path('.github/workflows/peikko-ui-finalize.yml').unlink()
          PY
          git config user.name 'TURTO Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- updates/2.2.30/peikko_workspace.py tools/verify_peikko_2230_runtime.py .github/workflows/peikko-ui-finalize.yml
          git -c commit.gpgsign=false commit -m 'Keep Peikko results visible at 720p and always clean up Windows GUI fixtures'
      - name: Repin corrected runtime without changing earlier immutable commits
        run: |
          python - <<'PY'
          import importlib.util, json, re
          spec = importlib.util.spec_from_file_location('pins','tools/prepare_peikko_2230_release.py')
          p = importlib.util.module_from_spec(spec); spec.loader.exec_module(p)
          source = p.git('rev-parse','HEAD')
          installer_path = p.NEW / 'runtime_installer.py'
          installer = installer_path.read_text(encoding='utf-8')
          payloads = p.literal(installer,'PAYLOADS')
          name = 'peikko_workspace.py'
          payloads[name] = (source, 'updates/2.2.30/'+name, p.sha(p.NEW/name))
          installer_path.write_text(p.assign(installer,'PAYLOADS',payloads),encoding='utf-8')
          installer_commit = p.commit('Freeze corrected 2.2.30 compact workspace payload',['updates/2.2.30/runtime_installer.py'])
          bootstrap_path = p.NEW / 'app.pyw'
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          critical = p.literal(bootstrap,'CRITICAL_PROGRAM_SHA256')
          critical[name] = p.sha(p.NEW/name)
          bootstrap = p.assign(bootstrap,'CRITICAL_PROGRAM_SHA256',critical)
          bootstrap = re.sub(r'^INSTALLER_COMMIT = .*$', f'INSTALLER_COMMIT = "{installer_commit}"', bootstrap, flags=re.M)
          bootstrap = re.sub(r'^INSTALLER_SHA256 = .*$', f'INSTALLER_SHA256 = "{p.sha(installer_path)}"', bootstrap, flags=re.M)
          bootstrap_path.write_text(bootstrap,encoding='utf-8')
          app_commit = p.commit('Freeze corrected Peikko bootstrap and runtime checksums',['updates/2.2.30/app.pyw'])
          manifest_path = p.ROOT / 'update_manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for item in manifest['files']:
              if item['path'] == 'app.pyw':
                  item['url'] = f'https://raw.githubusercontent.com/{p.REPO}/{app_commit}/updates/2.2.30/app.pyw'
                  item['sha256'] = p.sha(bootstrap_path)
          manifest_path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          path = p.ROOT / 'OPRAVIT_TURTO.ps1'
          recovery = path.read_text(encoding='utf-8')
          for key,value in [('AppCommit',app_commit),('AppSha256',p.sha(bootstrap_path))]:
              recovery = re.sub(r'^\$'+key+r' = .*$',f"${key} = '{value}'",recovery,flags=re.M)
          path.write_text(recovery,encoding='utf-8')
          head = p.commit('Publish final 2.2.30 candidate pins after compact-layout repair',['update_manifest.json','OPRAVIT_TURTO.ps1'])
          print(json.dumps(dict(source_commit=source,installer_commit=installer_commit,bootstrap_commit=app_commit,head=head),indent=2))
          PY
      - name: Verify final release and 720p installed GUI
        run: |
          python tools/verify_release.py
          python tools/verify_pinned_sources.py
          python tools/verify_peikko_2230.py
          xvfb-run -a -s '-screen 0 1280x720x24' python tools/verify_peikko_2230_runtime.py
      - name: Push candidate branch
        run: git push origin HEAD:release/2.2.30-peikko-data
      - name: Export candidate for authorized publication and review
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/peikko-ui-final"
          git archive HEAD -o "$RUNNER_TEMP/peikko-ui-final/source.zip"
          git bundle create "$RUNNER_TEMP/peikko-ui-final/history.bundle" --all
          git log -5 --format='%H %s' > "$RUNNER_TEMP/peikko-ui-final/commits.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: peikko-2230-ui-final
          path: ${{ runner.temp }}/peikko-ui-final/
          retention-days: 3
