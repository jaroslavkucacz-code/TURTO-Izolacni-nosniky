name: HSD integration
on:
  push:
    branches: ['repair/hsd-schedule-2236']
    paths: ['.github/workflows/hsd-e2e.yml', 'tools/verify_hsd_workflow_2236.py']
  pull_request:
    paths: ['updates/2.2.36/**', 'tools/verify_hsd_workflow_2236.py']
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install pillow openpyxl pdfplumber pymupdf reportlab
      - name: Actual Tk workflow on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/verify_hsd_workflow_2236.py
      - name: Actual Tk workflow and native OCR on Windows
        if: runner.os == 'Windows'
        run: python tools/verify_hsd_workflow_2236.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsd-results-${{ runner.os }}
          path: hsd-test-*.json
          if-no-files-found: warn
          retention-days: 14
