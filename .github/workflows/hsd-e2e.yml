name: HSD integration
on:
  push:
    branches: ['repair/hsd-schedule-2236']
    paths: ['.github/workflows/hsd-e2e.yml', 'tools/verify_hsd_workflow_2236.py', 'tools/fixtures/hsd_*', 'updates/2.2.36/**']
  pull_request:
    paths: ['updates/2.2.36/**', 'tools/verify_hsd_workflow_2236.py', 'tools/fixtures/hsd_*', '.github/workflows/hsd-e2e.yml']
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve pinned LF bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install pillow openpyxl pdfplumber reportlab
      - name: Actual Tk workflow on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1366x768x24" python tools/verify_hsd_workflow_2236.py
      - name: Actual Tk workflow and native OCR on Windows
        if: runner.os == 'Windows'
        run: python tools/verify_hsd_workflow_2236.py
      - name: Archive exact reviewed source snapshot
        if: runner.os == 'Linux'
        run: git archive --format=zip --output=hsd-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hsd-results-${{ runner.os }}
          path: |
            hsd-test-*.json
            hsd-evidence-*.png
            hsd-source.zip
          if-no-files-found: warn
          retention-days: 14
