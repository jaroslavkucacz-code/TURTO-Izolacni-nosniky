name: HSD integration
on:
  push:
    branches: ['repair/hsd-schedule-2236']
    paths: ['.github/workflows/hsd-e2e.yml', 'tools/verify_hsd_workflow_2236.py']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoding dependencies
        run: python -m pip install pillow openpyxl pdfplumber pymupdf reportlab
      - name: Reproduce installed 2.2.35 runtime in isolated directory
        run: |
          xvfb-run -a python - <<'PY'
          from pathlib import Path
          import runpy, shutil
          root = Path('runtime-review').resolve()
          root.mkdir(exist_ok=True)
          runpy.run_path('updates/2.2.35/runtime_installer.py')['install_runtime'](root)
          shutil.make_archive('runtime-review', 'zip', root)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hsd-runtime-review
          path: runtime-review.zip
          retention-days: 3
