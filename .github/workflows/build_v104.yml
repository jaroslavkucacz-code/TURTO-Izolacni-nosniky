name: Build TURTO ISO v1.0.4 update

on:
  push:
    paths:
      - ".github/workflows/build_v104.yml"
      - "tools/build_v104.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install --quiet pillow
      - name: Build and verify v1.0.4
        run: python tools/build_v104.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/1.0.4 update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Release TURTO ISO v1.0.4 footer and icon position"
          git pull --rebase origin main
          git push origin main
