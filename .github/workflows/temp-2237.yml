name: TEMP 2.2.37 substitution verification

on:
  push:
    branches:
      - release/2.2.37
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve repository bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install pillow openpyxl pdfplumber reportlab
      - name: Verify substitution logic
        run: python tools/verify_shear_substitution_2237.py
      - name: Verify installed Tk substitution UI on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1366x768x24" python tools/verify_shear_substitution_ui_2237.py
      - name: Verify installed Tk substitution UI on Windows
        if: runner.os == 'Windows'
        run: python -X utf8 tools/verify_shear_substitution_ui_2237.py
