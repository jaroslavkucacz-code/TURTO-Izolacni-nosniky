name: Build TURTO v1.0.0 update

on:
  push:
    paths:
      - ".github/workflows/build_v100.yml"
      - "tools/build_v100.py"
      - "tools/run_build_v100.py"
      - "tools/verify_v100_sources.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify v1.0.0
        run: python tools/run_build_v100.py
      - name: Install source-verification dependencies
        run: python -m pip install --quiet pdfplumber requests
      - name: Verify current DoP and Annex 2
        run: python tools/verify_v100_sources.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/1.0.0 update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Release TURTO v1.0.0 complete current HIT family"
          git pull --rebase origin main
          git push origin main
