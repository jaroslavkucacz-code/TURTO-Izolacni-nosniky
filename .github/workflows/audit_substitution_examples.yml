name: Audit substitution examples

on:
  push:
    paths:
      - ".github/workflows/audit_substitution_examples.yml"
      - "tools/audit_substitution_examples.py"
      - "tools/audit_hit_substitution_design.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install --quiet pdfplumber
      - name: Audit source records and conversion inputs
        run: python tools/audit_substitution_examples.py
      - name: Audit HIT designs against examples
        run: python tools/audit_hit_substitution_design.py
