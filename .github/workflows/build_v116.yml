name: Build TURTO ISO v1.1.6 update

on:
  push:
    paths:
      - ".github/workflows/build_v116.yml"
      - "tools/build_v116.py"
      - "tools/build_v116_payload.part*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF verification dependencies
        run: python -m pip install --disable-pip-version-check Pillow pypdfium2
      - name: Build and verify v1.1.6
        run: python tools/build_v116.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/1.1.6 update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Release TURTO ISO v1.1.6 variants and PDF report"
          git pull --rebase origin main
          git push origin main
