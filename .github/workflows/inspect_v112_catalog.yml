name: Inspect v1.1.2 catalog metadata

on:
  push:
    paths:
      - ".github/workflows/inspect_v112_catalog.yml"
      - "tools/inspect_v112_catalog.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect catalog metadata
        run: python tools/inspect_v112_catalog.py
