name: Build TURTO v0.6.6 update

on:
  push:
    paths:
      - ".github/workflows/build_v066.yml"
      - "tools/build_v066.py"
      - "tools/v066_bulk_import_engine.py"
      - "tools/v066_bulk_import.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify v0.6.6
        run: python tools/build_v066.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/0.6.6 update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Release TURTO v0.6.6 reviewed bulk import"
          git pull --rebase origin main
          git push origin main
