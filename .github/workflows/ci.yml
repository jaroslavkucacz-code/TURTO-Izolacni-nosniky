      - name: Actual 3.0.0 to 3.0.1 update and Tk workflow on Windows
        if: runner.os == 'Windows'
        run: python tools/verify_iso_301.py
      - name: Verify live immutable payload downloads
        run: python -c "import runpy; d=runpy.run_path('updates/3.0.1/runtime_installer.py'); [d['_download'](*p) for p in d['PAYLOADS'].values()]; print('All 3.0.1 live payload hashes verified')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iso301-results-${{ runner.os }}
          path: |
            iso301-test-*.json
            iso301-window-*.png
