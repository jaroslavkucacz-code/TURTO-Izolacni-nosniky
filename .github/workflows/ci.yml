name: TURTO CI

on:
  push:
    branches:
      - main
      - "cleanup/**"
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release and repository hygiene
        run: python tools/verify_release.py
