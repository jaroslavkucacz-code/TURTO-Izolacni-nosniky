name: TURTO CI

on:
  push:
    branches:
      - main
      - "cleanup/**"
      - "release/**"
      - "fix/**"
      - "feature/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release and repository hygiene
        run: python tools/verify_release.py
      - name: Verify pinned runtime sources
        run: python tools/verify_pinned_sources.py
      - name: Verify 2.2.18 recovery path
        run: python tools/verify_recovery_2218.py
      - name: Verify Program layout migration
        run: python tools/verify_program_layout_2213.py
      - name: Verify runtime_paths startup hotfix
        run: python tools/verify_runtime_import_2214.py
      - name: Verify backup hierarchy cleanup
        run: python tools/verify_cleanup_2215.py
      - name: Verify runtime flattening and incremental delivery
        run: python tools/verify_runtime_flatten_2216.py
      - name: Verify HIT workspace flattening
        run: python tools/verify_hit_flatten_2217.py
      - name: Verify deep HIT workspace flattening
        run: python tools/verify_hit_deep_flatten_2219.py
      - name: Verify central AKCE runtime flattening
        run: python tools/verify_central_flatten_2220.py
      - name: Verify shear-dowel movement
        run: python tools/verify_shear_movement.py
      - name: Verify Ancon ED terminology and passing alternatives
        run: python tools/verify_ancon_alternatives_2221.py
      - name: Verify release-note race and repair
        run: python tools/verify_release_notes_race_2222.py
      - name: Verify shear-dowel startup method chain
        run: python tools/verify_shear_startup_2223.py
      - name: Verify UI, autocomplete and Schöck KL-O
        run: python tools/verify_ui_223.py
      - name: Verify unified tables and tab consistency
        run: python tools/verify_ui_224.py
      - name: Verify layout hierarchy and contextual actions
        run: python tools/verify_ui_225.py
      - name: Verify substitution geometry and UI visibility
        run: python tools/verify_substitution_226.py
      - name: Verify PohlCon/MAX FRANK shear-dowel catalogs
        run: python tools/verify_shear_catalogs_227.py
      - name: Verify selectable PDF scope and cleanup
        run: python tools/verify_pdf_scope_228.py
      - name: Verify PDF multi-selection and catalog browser
        run: python tools/verify_pdf_catalogs_229.py

  windows-smoke:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - name: Preserve repository bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release on Windows
        run: python tools/verify_release.py
      - name: Verify pinned runtime sources on Windows
        run: python tools/verify_pinned_sources.py
      - name: Verify 2.2.18 recovery path on Windows
        run: python tools/verify_recovery_2218.py
      - name: Verify Program layout migration on Windows
        run: python tools/verify_program_layout_2213.py
      - name: Verify runtime_paths startup hotfix on Windows
        run: python tools/verify_runtime_import_2214.py
      - name: Verify backup hierarchy cleanup on Windows
        run: python tools/verify_cleanup_2215.py
      - name: Verify runtime flattening and incremental delivery on Windows
        run: python tools/verify_runtime_flatten_2216.py
      - name: Verify HIT workspace flattening on Windows
        run: python tools/verify_hit_flatten_2217.py
      - name: Verify deep HIT workspace flattening on Windows
        run: python tools/verify_hit_deep_flatten_2219.py
      - name: Verify central AKCE runtime flattening on Windows
        run: python tools/verify_central_flatten_2220.py
      - name: Verify shear-dowel movement on Windows
        run: python tools/verify_shear_movement.py
      - name: Verify Ancon ED terminology and passing alternatives on Windows
        run: python tools/verify_ancon_alternatives_2221.py
      - name: Verify release-note race and repair on Windows
        run: python tools/verify_release_notes_race_2222.py
      - name: Verify shear-dowel startup method chain on Windows
        run: python tools/verify_shear_startup_2223.py
      - name: Verify UI, autocomplete and Schöck KL-O on Windows
        run: python tools/verify_ui_223.py
      - name: Verify unified tables and tab consistency on Windows
        run: python tools/verify_ui_224.py
      - name: Verify layout hierarchy and contextual actions on Windows
        run: python tools/verify_ui_225.py
      - name: Verify substitution geometry and UI visibility on Windows
        run: python tools/verify_substitution_226.py
      - name: Verify PohlCon/MAX FRANK shear-dowel catalogs on Windows
        run: python tools/verify_shear_catalogs_227.py
      - name: Verify selectable PDF scope and cleanup on Windows
        run: python tools/verify_pdf_scope_228.py
      - name: Verify PDF multi-selection and catalog browser on Windows
        run: python tools/verify_pdf_catalogs_229.py
      - name: Parse recovery PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\OPRAVIT_TURTO.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'OPRAVIT_TURTO.ps1: PowerShell syntax OK'
