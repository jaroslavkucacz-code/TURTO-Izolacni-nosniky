name: TURTO CI

on:
  push:
    branches:
      - main
      - "cleanup/**"
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release and repository hygiene
        run: python tools/verify_release.py

  windows-smoke:
    name: Windows smoke
    runs-on: windows-latest
    steps:
      - name: Preserve repository bytes
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release on Windows
        run: python tools/verify_release.py

      - name: Parse recovery PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\OPRAVIT_TURTO.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'OPRAVIT_TURTO.ps1: PowerShell syntax OK'
