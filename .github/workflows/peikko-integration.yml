name: Peikko integration audit
on:
  push:
    branches: [fix/peikko-unified-2.2.29]
    paths: [.github/workflows/peikko-integration.yml]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export audited source snapshot
        run: |
          git archive HEAD -o source.zip
          git bundle create history.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: peikko-source-audit
          path: |
            source.zip
            history.bundle
          retention-days: 1
