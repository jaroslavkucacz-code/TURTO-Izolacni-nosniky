name: Build TURTO v0.6.3 update

on:
  push:
    paths:
      - ".github/workflows/build_v063.yml"
      - "tools/build_v063.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize typed plus-minus notation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('updates/0.6.2/catalog_engine.py')
          s = p.read_text(encoding='utf-8')
          old = '    text = str(text).replace("+/-", "±").replace("+-", "±").replace("-+", "±")\n'
          new = '''    text = str(text)\n    text = re.sub(r"\\+/\\-(?=[A-Za-z0-9])", "±-", text)\n    text = re.sub(r"\\+\\-(?=[A-Za-z0-9])", "±-", text)\n    text = re.sub(r"\\-\\+(?=[A-Za-z0-9])", "±-", text)\n    text = text.replace("+/-", "±").replace("+-", "±").replace("-+", "±")\n'''
          if s.count(old) != 1:
              raise SystemExit('Expected plus-minus normalization line not found exactly once')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build and verify v0.6.3
        run: python tools/build_v063.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/0.6.3 update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Release TURTO v0.6.3 strict concrete filter"
          git push
