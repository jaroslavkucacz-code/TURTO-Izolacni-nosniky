name: Build TURTO ISO v1.1.16 HIT schedule import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_v1116.yml'
      - 'tools/build_v1116.py'
      - 'tools/v1116_hit_schedule.py'
      - 'tools/verify_v1116.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: turto-iso-v1116-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GUI and existing PDF regression test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth python3-tk
          python -m pip install --disable-pip-version-check 'reportlab>=4.2,<5' pypdf pymupdf pillow
      - name: Build and verify parser, all 33 positions, real Tk import and previous-release regression
        run: xvfb-run -a -s '-screen 0 1440x1080x24' python tools/build_v1116.py
      - name: Upload import and previous-release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turto-iso-v1.1.16-hit-schedule-diagnostics
          path: _diag_v1116/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish verified update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/1.1.16 update_manifest.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'Release TURTO ISO v1.1.16 bulk HIT schedule import and exact length checks'
          git pull --rebase origin main
          git push origin main
