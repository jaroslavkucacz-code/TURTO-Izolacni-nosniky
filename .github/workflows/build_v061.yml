name: Build TURTO v0.6.1 update

on:
  push:
    paths:
      - ".github/workflows/build_v061.yml"
      - "tools/build_v061.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize builder test import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/build_v061.py')
          s = p.read_text(encoding='utf-8')
          old = '''    module = importlib.util.module_from_spec(spec)\n    assert spec.loader is not None\n    spec.loader.exec_module(module)\n'''
          new = '''    module = importlib.util.module_from_spec(spec)\n    assert spec.loader is not None\n    import sys\n    sys.modules[spec.name] = module\n    spec.loader.exec_module(module)\n'''
          if old not in s:
              raise SystemExit('Expected regression-test import block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build and verify v0.6.1
        run: python tools/build_v061.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/0.6.1 update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Release TURTO v0.6.1 automatic update"
          git push
