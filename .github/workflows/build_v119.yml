name: Build TURTO ISO v1.1.9 update

on:
  push:
    paths:
      - ".github/workflows/build_v119.yml"
      - "tools/build_v119.py"
      - "tools/build_v119_payload.part*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify v1.1.9
        run: python tools/build_v119.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/1.1.9 update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Release TURTO ISO v1.1.9 bulk analysis progress and cancellation"
          git pull --rebase origin main
          git push origin main
