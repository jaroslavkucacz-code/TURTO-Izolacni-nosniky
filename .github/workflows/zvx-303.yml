name: ZVX 3.0.3 manufacturer-source inspection
on:
  push:
    branches: [fix/3.0.3-zvx-table-columns]
    paths: [.github/workflows/zvx-303.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pdfplumber pymupdf
      - name: Read official DoP without modifying installed data
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, sys, time, urllib.request
          from pathlib import Path
          import pdfplumber, fitz
          folder = Path('zvx303-evidence'); folder.mkdir()
          url = 'https://downloads.halfen.com/catalogues/de/media/declarationofperformance/reinforcementsystems/CONF-DOP_HIT-HP_SP_07-23-E.pdf'
          data = None
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'TURTO-catalogue-verification/3.0.3'})
                  with urllib.request.urlopen(req, timeout=90) as response:
                      data = response.read(40 * 1024 * 1024)
                  assert data.startswith(b'%PDF-')
                  break
              except Exception:
                  if attempt == 2: raise
                  time.sleep(3)
          path = folder / 'CONF-DOP_HIT-HP_SP_07-23-E.pdf'; path.write_bytes(data)
          sys.path.insert(0, str(Path('updates/1.1.17').resolve()))
          import hit_core
          with pdfplumber.open(path) as pdf:
              assert len(pdf.pages) == 124
              old = hit_core._parse_zvx_pages(pdf)
              (folder / 'old-records.json').write_text(json.dumps(old, ensure_ascii=False, indent=2), encoding='utf-8')
              for i in range(94, 100):
                  (folder / f'page-{i+1}.txt').write_text(pdf.pages[i].extract_text(x_tolerance=1, y_tolerance=2) or '', encoding='utf-8')
                  (folder / f'page-{i+1}-words.json').write_text(json.dumps(pdf.pages[i].extract_words(), ensure_ascii=False), encoding='utf-8')
          doc = fitz.open(path)
          for i in (94, 95, 97, 98, 99):
              doc[i].get_pixmap(matrix=fitz.Matrix(2, 2)).save(folder / f'page-{i+1}.png')
          report = {'source_url': url, 'sha256': hashlib.sha256(data).hexdigest(), 'pages': len(doc), 'old_zvx_records': len(old)}
          (folder / 'inspection.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zvx303-manufacturer-evidence
          path: zvx303-evidence/
          retention-days: 14
