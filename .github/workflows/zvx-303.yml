name: ZVX 3.0.3 integration

on:
  push:
    branches:
      - main
      - "fix/**"
      - "release/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  zvx-303-integration:
    name: ZVX tables 3.0.3 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve exact bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install pillow openpyxl pdfplumber reportlab
      - name: Actual 3.0.2 to 3.0.3 update and manufacturer-table proposals on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python tools/verify_zvx_303.py
      - name: Actual 3.0.2 to 3.0.3 update and manufacturer-table proposals on Windows
        if: runner.os == 'Windows'
        run: python tools/verify_zvx_303.py
      - name: Verify live immutable payload downloads
        run: python -c "import runpy; d=runpy.run_path('updates/3.0.3/runtime_installer.py'); [d['_download'](*p) for p in d['PAYLOADS'].values()]; print('All 3.0.3 live payload hashes verified')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zvx303-results-${{ runner.os }}
          path: |
            zvx303-test-*.json
            zvx303-window-*.png
          if-no-files-found: warn
          retention-days: 14
