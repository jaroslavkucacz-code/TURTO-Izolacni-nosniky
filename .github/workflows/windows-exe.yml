name: TURTO Statika Windows EXE

on:
  push:
    branches: [main, "release/3.0.12-*"]
    paths:
      - "packaging/windows/**"
      - "tools/*windows_exe.py"
      - ".github/workflows/windows-exe.yml"
      - "CURRENT_VERSION"
      - "update_manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/windows/requirements.txt
      - run: python -m pip install -r packaging/windows/requirements.txt
      - name: Full desktop for actual GUI tests
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: python tools/verify_release.py
      - name: Build portable EXE from verified sources
        run: python tools/build_windows_exe.py
      - name: Test frozen GUI, SQLite, PDF, Excel and online update restart
        run: python tools/verify_windows_exe.py
      - name: Package tested application
        shell: pwsh
        run: |
          $version = (Get-Content CURRENT_VERSION -Raw).Trim()
          $archive = "TURTO-Statika-$version-Windows-x64.zip"
          Compress-Archive -Path 'dist/TURTO Statika' -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: TURTO-Statika-Windows-x64
          path: |
            TURTO-Statika-*-Windows-x64.zip
            TURTO-Statika-*-Windows-x64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-EXE-verification
          path: build/windows/proof

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TURTO-Statika-Windows-x64
          path: release
      - name: Publish verified Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(cat CURRENT_VERSION)
          gh release create "v$version" release/* --target "$GITHUB_SHA" \
            --title "TURTO Statika $version – Windows EXE" \
            --notes-file packaging/windows/CTETE_ME.txt
