name: Build TURTO ISO v1.1.1 update

on:
  push:
    paths:
      - ".github/workflows/build_v111.yml"
      - "tools/build_v111.py"
      - "tools/build_v111_runner.py"
      - "tools/v111_substitution_workspace.py"
      - "tools/verify_v111_substitutions.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verification dependency
        run: python -m pip install --quiet pdfplumber
      - name: Build and verify v1.1.1
        run: python tools/build_v111_runner.py
      - name: Verify real Egcobox to HIT examples
        run: python tools/verify_v111_substitutions.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Verification imports generated modules, so remove Python bytecode before publishing.
          find updates/1.1.1 -type d -name __pycache__ -prune -exec rm -rf {} +
          find updates/1.1.1 -type f -name '*.pyc' -delete
          # The runner patches these tracked build helpers only inside CI; do not leave
          # their temporary working-copy changes around before git pull --rebase.
          git restore tools/build_v111.py tools/v111_substitution_workspace.py
          git add updates/1.1.1 update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Release TURTO ISO v1.1.1 corrected HIT substitutions"
          git pull --rebase origin main
          git push origin main
