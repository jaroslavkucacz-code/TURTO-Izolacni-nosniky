name: Build TURTO ISO v1.1.7 update

on:
  push:
    paths:
      - ".github/workflows/build_v117.yml"
      - "tools/build_v117.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build and verification dependencies
        run: python -m pip install --disable-pip-version-check Pillow pypdfium2 pdfplumber
      - name: Download current HIT DoP for real regression
        run: curl -L --fail --retry 3 "https://downloads.halfen.com/catalogues/de/media/declarationofperformance/reinforcementsystems/CONF-DOP_HIT-HP_SP_07-23-E.pdf" -o _diag_hit_dop.pdf
      - name: Correct verified pressure-transfer expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/build_v117.py")
          text = path.read_text(encoding="utf-8")
          old = '{6: "max.", 8: "available", 10: "h = 170", 12: "h = 170"},'
          new = '{6: "max.", 8: "available", 10: "h = 170", 12: "jiným tlakovým přenosem"},'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one regression pattern, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Build and verify v1.1.7
        env:
          HIT_DOP_PATH: ${{ github.workspace }}/_diag_hit_dop.pdf
        run: python tools/build_v117.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_v117.py updates/1.1.7 update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Release TURTO ISO v1.1.7 diameter availability explanations"
          git pull --rebase origin main
          git push origin main
