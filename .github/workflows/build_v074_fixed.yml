name: Build TURTO v0.7.4 fixed update

on:
  push:
    paths:
      - ".github/workflows/build_v074_fixed.yml"
      - "tools/build_v074_fixed.py"
      - "assets/app_icon64.png.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and verify v0.7.4
        run: python tools/build_v074_fixed.py
      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/0.7.4 update_manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Release TURTO v0.7.4 startup monitor and transparent icon"
          git pull --rebase origin main
          git push origin main
